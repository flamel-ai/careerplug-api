name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # Runs on every push and PR, including forks. Needs no secrets.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Proves the vendored spec still matches what CareerPlug serves, and that the
  # committed generated code is exactly what the generator produces. Needs no
  # credentials: /swagger_doc is public.
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm refresh
      - name: Fail if the spec or generated code is out of date
        run: |
          if ! git diff --quiet; then
            echo "::warning::Upstream spec or generated output has drifted. Diff:"
            git diff --stat
            git diff | head -200
            exit 1
          fi
          echo "Spec and generated code are up to date."

  # Live round-trip. Runs only on pushes to main, since GitHub does not expose
  # secrets to fork PRs. Self-skips when no credentials are configured, so this
  # job stays green until someone adds them.
  integration:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          # Repository secrets (Settings -> Secrets and variables -> Actions).
          # Encrypted at rest, masked in logs, never exposed to fork PRs.
          CAREERPLUG_CLIENT_ID: ${{ secrets.CAREERPLUG_CLIENT_ID }}
          CAREERPLUG_CLIENT_SECRET: ${{ secrets.CAREERPLUG_CLIENT_SECRET }}
          # Non-secret config (Settings -> Variables).
          CAREERPLUG_PARTNER_SLUG: ${{ vars.CAREERPLUG_PARTNER_SLUG }}
          CAREERPLUG_FEED_NAME: ${{ vars.CAREERPLUG_FEED_NAME }}
