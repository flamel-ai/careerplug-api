name: Release

# Every push to main: verify, publish to the public npm registry (with
# provenance), then tag + create a GitHub release. Mirrors the release
# workflow used by the sibling @flamel-ai SDKs.
#
# Publishing happens here rather than from a laptop on purpose: package.json
# sets `publishConfig.provenance: true`, and npm refuses to generate a
# provenance attestation outside a supported CI provider ("Automatic
# provenance generation not supported for provider: ..."). CI is the only
# place `npm publish` can succeed with this config.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the version-bump commit + create the release
  id-token: write # npm provenance

# Never run two releases at once (avoids version-bump races).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Full verification gate — nothing publishes unless this is green.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Optional live round-trip; self-skips unless CareerPlug credentials exist.
      - run: pnpm test:integration
        env:
          CAREERPLUG_CLIENT_ID: ${{ secrets.CAREERPLUG_CLIENT_ID }}
          CAREERPLUG_CLIENT_SECRET: ${{ secrets.CAREERPLUG_CLIENT_SECRET }}
          CAREERPLUG_PARTNER_SLUG: ${{ vars.CAREERPLUG_PARTNER_SLUG }}
          CAREERPLUG_FEED_NAME: ${{ vars.CAREERPLUG_FEED_NAME }}

      # Skip the publish steps (but keep CI green) until NPM_TOKEN is configured.
      - id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret not set — skipping publish. Add it in Settings → Secrets to enable auto-publish."
          fi

      # Bump only when the version in package.json is already on the registry.
      # This lets the very first release ship as the committed version (0.1.0)
      # instead of skipping straight to 0.1.1, while every later push to main
      # still auto-bumps the patch the way the sibling SDKs do.
      - name: Bump version if already published
        if: steps.token.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${CURRENT}" version > /dev/null 2>&1; then
            pnpm version patch -m "chore(release): v%s [skip ci]"
          else
            echo "${NAME}@${CURRENT} is not on the registry yet — publishing as-is."
          fi
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pushed with GITHUB_TOKEN, which does NOT retrigger workflows (no loop).
      - name: Push bump + create GitHub release
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --follow-tags origin HEAD:main
          gh release create "v${VERSION}" --generate-notes --title "v${VERSION}"
